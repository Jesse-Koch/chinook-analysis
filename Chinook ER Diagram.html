<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinook ERD · Dark Text</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f2f0eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'anthropic-sans', -apple-system, system-ui, sans-serif;
      padding: 1.5rem;
    }
    #card {
      max-width: 1400px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 20px rgba(0,0,0,0.03);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      transition: background 0.2s;
    }
    #erd {
      width: 100%;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }
    #erd svg {
      max-width: 100%;
      height: auto;
      background: transparent;
      display: block;
      border-radius: 18px;
    }
    /* force dark text on all labels and attributes */
    #erd svg.erDiagram .label,
    #erd svg.erDiagram .attribute,
    #erd svg.erDiagram .entity-label,
    #erd svg.erDiagram .text,
    #erd svg.erDiagram tspan,
    #erd svg.erDiagram .node text,
    #erd svg.erDiagram .row-text {
      fill: #1e1e1c !important;
      color: #1e1e1c !important;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    /* specifically for attribute rows (key/type) */
    #erd svg.erDiagram .attribute tspan,
    #erd svg.erDiagram .row-text tspan {
      fill: #1e1e1c !important;
      color: #1e1e1c !important;
    }
    /* divider styling (already in embed) */
    #erd svg.erDiagram .divider path {
      stroke-opacity: 0.5;
    }
    /* row-rect stroke none (already in embed) */
    #erd svg.erDiagram .row-rect-odd path,
    #erd svg.erDiagram .row-rect-even path {
      stroke: none !important;
    }
    /* entity box strokes – subtle */
    #erd svg.erDiagram .node rect {
      stroke: #b0aea4 !important;
      stroke-width: 1.2px !important;
    }
    /* dark mode: keep background light but readable */
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a18; }
      #card { background: #f0efe8; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
      #erd svg.erDiagram .node rect {
        stroke: #8a887e !important;
      }
      /* ensure text stays dark even in dark mode */
      #erd svg.erDiagram .label,
      #erd svg.erDiagram .attribute,
      #erd svg.erDiagram .entity-label,
      #erd svg.erDiagram .text,
      #erd svg.erDiagram tspan,
      #erd svg.erDiagram .node text,
      #erd svg.erDiagram .row-text {
        fill: #1a1a18 !important;
        color: #1a1a18 !important;
      }
    }
    .footnote {
      margin-top: 1.5rem;
      text-align: right;
      font-size: 0.8rem;
      color: #7a7a72;
      border-top: 1px solid #e0ded6;
      padding-top: 1rem;
      letter-spacing: 0.02em;
    }
    @media (prefers-color-scheme: dark) {
      .footnote { border-top-color: #b0aea4; color: #5a5a52; }
    }
  </style>
</head>
<body>
<div id="card">
  <div id="erd"></div>
  <div class="footnote">Chinook · ER Diagram (dark text)</div>
</div>

<script type="module">
  import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

  // detect system dark mode – but we will FORCE dark text regardless
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;

  await document.fonts.ready;

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    fontFamily: '"anthropic-sans", -apple-system, system-ui, sans-serif',
    themeVariables: {
      darkMode: dark,  // keeps background of diagram consistent with system
      fontSize: '13px',
      fontFamily: '"anthropic-sans", -apple-system, system-ui, sans-serif',
      // set text to dark/almost black for readability
      textColor: '#1e1e1c',
      primaryTextColor: '#1e1e1c',
      secondaryTextColor: '#1e1e1c',
      tertiaryTextColor: '#1e1e1c',
      // line colors – subtle
      lineColor: '#7a7a72',
      primaryColor: '#f7f6f0',
      primaryBorderColor: '#b0aea4',
      secondaryColor: '#f0efe8',
      tertiaryColor: '#ffffff',
      // force dark on all text elements
      fontFamily: '"anthropic-sans", -apple-system, system-ui, sans-serif',
    },
  });

  const erDefinition = `erDiagram
  ARTIST ||--o{ ALBUM : records
  ALBUM ||--o{ TRACK : contains
  GENRE ||--o{ TRACK : categorizes
  MEDIATYPE ||--o{ TRACK : formats
  TRACK ||--o{ INVOICELINE : "sold as"
  INVOICE ||--o{ INVOICELINE : contains
  CUSTOMER ||--o{ INVOICE : places
  EMPLOYEE ||--o{ CUSTOMER : supports
  EMPLOYEE ||--o{ EMPLOYEE : "reports to"
  PLAYLIST ||--o{ PLAYLISTTRACK : includes
  TRACK ||--o{ PLAYLISTTRACK : "included in"

  ARTIST {
    int ArtistId PK
    string Name
  }
  ALBUM {
    int AlbumId PK
    string Title
    int ArtistId FK
  }
  TRACK {
    int TrackId PK
    string Name
    int AlbumId FK
    int GenreId FK
    int MediaTypeId FK
    decimal UnitPrice
  }
  GENRE {
    int GenreId PK
    string Name
  }
  MEDIATYPE {
    int MediaTypeId PK
    string Name
  }
  INVOICE {
    int InvoiceId PK
    int CustomerId FK
    datetime InvoiceDate
    decimal Total
  }
  INVOICELINE {
    int InvoiceLineId PK
    int InvoiceId FK
    int TrackId FK
    decimal UnitPrice
    int Quantity
  }
  CUSTOMER {
    int CustomerId PK
    string FirstName
    string LastName
    string Country
    int SupportRepId FK
  }
  EMPLOYEE {
    int EmployeeId PK
    string FirstName
    string LastName
    string Title
    int ReportsTo FK
  }
  PLAYLIST {
    int PlaylistId PK
    string Name
  }
  PLAYLISTTRACK {
    int PlaylistId FK
    int TrackId FK
  }
`;

  const { svg } = await mermaid.render('erd-svg', erDefinition);
  document.getElementById('erd').innerHTML = svg;

  // ---- post-process: replace path-based nodes with <rect> for rounded corners ----
  document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs);
    const y = Math.min(...ys);
    const w = Math.max(...xs) - x;
    const h = Math.max(...ys) - y;

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');

    // copy attributes from original path
    for (const attr of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(attr)) {
        rect.setAttribute(attr, firstPath.getAttribute(attr));
      }
    }
    // ensure stroke is set
    if (!rect.hasAttribute('stroke')) {
      rect.setAttribute('stroke', '#b0aea4');
      rect.setAttribute('stroke-width', '1.2');
    }
    firstPath.replaceWith(rect);
  });

  // ---- force all text to be dark (extra safety) ----
  document.querySelectorAll('#erd svg.erDiagram text, #erd svg.erDiagram tspan, #erd svg.erDiagram .label, #erd svg.erDiagram .attribute')
    .forEach(el => {
      el.setAttribute('fill', '#1e1e1c');
      el.setAttribute('style', (el.getAttribute('style') || '') + '; fill: #1e1e1c !important; color: #1e1e1c !important;');
    });

  // ---- row-rect: remove stroke ----
  document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path')
    .forEach(p => p.setAttribute('stroke', 'none'));

  console.log('✅ Chinook ERD with forced dark text for readability.');
</script>
</body>
</html>
